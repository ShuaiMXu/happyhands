  <text x="195" y="390" font-size="18">Evidence not bundled</text>
  <text x="195" y="426" font-size="14" fill="#6f6d66">Capture your own project</text>
  <text x="195" y="450" font-size="14" fill="#6f6d66">in the local workbench.</text>
 </g>
</svg>
